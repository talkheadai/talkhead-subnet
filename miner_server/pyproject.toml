[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "talkhead-miner-server"
version = "0.1.0"
description = "HTTP API for TalkHead miners backed by SadTalker."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "TalkHead Subnet Team" }
]
dependencies = [
  "face_alignment==1.3.5",
  "fastapi==0.122.0",
  "pydantic==2.12.4",
  "uvicorn==0.38.0",
  "requests==2.32.5",
  "pillow==10.0.0",
  "gTTS==2.5.4",
  "torch==2.0.0",
  "torchvision==0.15.1",
  "torchaudio==2.0.1",
  "numpy==1.23.4",
  "face-alignment==1.3.5",
  "imageio>=2.31.0,<3",
  "imageio-ffmpeg>=0.5.0,<1",
  "librosa==0.9.2",
  "numba==0.57.1",
  "resampy==0.3.1",
  "pydub==0.25.1",
  "scipy==1.10.1",
  "kornia==0.6.8",
  "tqdm==4.67.1",
  "yacs==0.1.8",
  "PyYAML==6.0.1",
  "joblib==1.1.0",
  "scikit-image==0.19.3",
  "basicsr==1.4.2",
  "facexlib==0.3.0",
  "gradio==3.50.2",
  "gfpgan==1.3.8",
  "av==12.0.0",
  "safetensors==0.4.3",
  "ffmpeg-python==0.2.0",
  "opencv-python==4.7.0.72"
]

[project.optional-dependencies]
dev = ["pytest==9.0.1"]

[project.urls]
Homepage = "https://github.com/opentensor/talkhead-subnet"
Issues = "https://github.com/opentensor/talkhead-subnet/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["miner_server*"]

[tool.setuptools.package-data]
miner_server = [
  "SadTalker/*",
  "SadTalker/**/*"
]

