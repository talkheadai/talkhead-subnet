[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "talkhead-subnet"
version = "0.1.0"
description = "TalkHead Subnet - A Bittensor subnet for talkhead generation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "TalkHead Subnet Team" }
]
dependencies = [
    "bittensor==10.2.0",
    "python-dotenv==1.2.2",
    "async-substrate-interface==1.6.4",
]

[project.optional-dependencies]
miner = []
validator = [
    "wandb==0.19.0",
    "numpy",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "loguru>=0.7.2",
    "numpy>=1.26",
    "opencv-python>=4.9",
    "opencv-python-headless>=4.9",
    "torch>=2.2",
    "torchaudio>=2.2",
    "torchcodec>=0.8.0",
    "insightface>=0.7.3",
    "onnxruntime>=1.18",
    "openai-whisper>=20231117",
    "boto3>=1.37.20",
]
dev = ["pytest==9.0.1"]

[project.urls]
Homepage = "https://github.com/talkhead-ai/talkhead-subnet"
Issues = "https://github.com/talkhead-ai/talkhead-subnet/issues"

[tool.setuptools]
include-package-data = true
py-modules = ["config", "utils"]

[tool.setuptools.packages.find]
where = ["."]
include = ["neurons*", "talkhead*", "executor*"]
